[package]
name = "rusty-downloader"
description = "Download manager for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "rusty_downloader_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
clipboard-win = "5.4.3"
rdl-core = { version = "0.1.0", path = "../crates/rdl-core", features = ["specta"] }
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5.4"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
