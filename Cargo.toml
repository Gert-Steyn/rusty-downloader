[workspace]
resolver = "3"
members = ["crates/rdl-bridge", "crates/rdl-core", "crates/rdl-native-host", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line numbers for backtraces but no full debug info (and none for
# dependencies): full debug info made `target` grow past 160 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
