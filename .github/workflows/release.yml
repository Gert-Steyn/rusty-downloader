name: Release

# Pushing a tag like v1.0.0 builds the installer, the portable zip and the
# browser extension, and publishes them as a GitHub Release. The tag must
# match the version in Cargo.toml. Tests aren't run again: tag a commit on
# main whose CI passed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version = "([^"]+)"') { throw 'No version in Cargo.toml' }
          $version = $Matches[1]
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml's version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Installer
        run: pnpm build
      - name: Portable zip
        run: pnpm portable
      - name: Browser extension
        shell: pwsh
        run: |
          pnpm ext:build
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($browser in 'chromium', 'firefox') {
            [IO.Compression.ZipFile]::CreateFromDirectory(
              (Resolve-Path "extension/dist/$browser"),
              "$PWD/dist/Rusty Downloader_${env:VERSION}_extension_$browser.zip")
          }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem target/release/bundle/nsis/*.exe
            Get-ChildItem target/release/bundle/portable/*.zip
            Get-ChildItem dist/*.zip
          ) | ForEach-Object { $_.FullName }
          gh release create '${{ github.ref_name }}' @assets --title "Rusty Downloader ${env:VERSION}" --generate-notes
