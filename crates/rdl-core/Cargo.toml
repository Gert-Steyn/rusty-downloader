[package]
name = "rdl-core"
description = "Download engine, storage and services for rusty-downloader (no UI dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5.3"
dirs = "7.0.0"
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
keyring-core = "1.0.1"
md-5 = { version = "0.11.0", default-features = false }
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "0.3.4", default-features = false }
win32job = { version = "2.0.3", default-features = false }
windows-dpapi = "0.2.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "test-util"] }

[features]
specta = ["dep:specta"]
