[package]
name = "rdl-bridge"
description = "Named-pipe protocol between rusty-downloader and its browser native-messaging host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
