[package]
name = "rdl-native-host"
description = "Browser native-messaging host that relays the extension's messages to rusty-downloader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rdl-bridge = { version = "0.1.0", path = "../rdl-bridge" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "rt", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tokio-util = "0.7.20"
