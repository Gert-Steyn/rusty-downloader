<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Rusty Downloader</title>
		<link rel="stylesheet" href="graphite.css" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body class="popup">
		<h1>Rusty Downloader</h1>
		<div class="status">
			<span class="dot" id="dot"></span>
			<div>
				<div id="state">Checking…</div>
				<div class="muted" id="detail"></div>
			</div>
		</div>
		<label><input type="checkbox" id="intercept" /> Take over downloads</label>
		<div class="muted" id="rule"></div>
		<footer>
			<button class="btn ghost small" id="options">Rules and options</button>
			<button class="btn small" id="recheck">Check again</button>
		</footer>
		<script type="module" src="popup.js"></script>
	</body>
</html>
